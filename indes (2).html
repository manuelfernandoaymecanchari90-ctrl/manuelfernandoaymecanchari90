<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Códigos QR</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --primary-color: #2563eb;
            --text-color: #1f2937;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #reader {
            width: 100%;
            margin-bottom: 20px;
            display: none; /* Oculto por defecto */
        }
        .history-container {
            text-align: left;
            margin-top: 20px;
            width: 100%;
        }
        .record {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .record-time {
            font-size: 0.85em;
            color: #6b7280;
            margin-bottom: 4px;
            display: block;
        }
        .record-data {
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lector QR</h2>
        
        <button id="btn-scan" onclick="iniciarEscaner()">📷 Activar Cámara</button>
        <div id="reader"></div>

        <div class="history-container">
            <h3>Historial de Lecturas</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let registros = JSON.parse(localStorage.getItem('qr_records')) || [];

        // Función para mostrar los registros guardados al cargar la página
        function renderizarHistorial() {
            const list = document.getElementById('history-list');
            list.innerHTML = ''; // Limpiar lista
            
            // Mostrar del más reciente al más antiguo
            const registrosInvertidos = [...registros].reverse();

            if (registrosInvertidos.length === 0) {
                list.innerHTML = '<p style="color: #6b7280; text-align: center;">Aún no hay códigos escaneados.</p>';
                return;
            }

            registrosInvertidos.forEach(record => {
                list.innerHTML += `
                    <div class="record">
                        <span class="record-time">🗓️ ${record.fecha}</span>
                        <span class="record-data">📄 ${record.datos}</span>
                    </div>
                `;
            });
        }

        // Función para activar la cámara
        function iniciarEscaner() {
            const readerDiv = document.getElementById('reader');
            const btnScan = document.getElementById('btn-scan');
            
            readerDiv.style.display = 'block';
            btnScan.style.display = 'none'; // Ocultar el botón mientras escanea

            // Configurar el escáner
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: { width: 250, height: 250 } },
                false
            );

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        // Función que se ejecuta cuando lee un QR correctamente
        function onScanSuccess(decodedText, decodedResult) {
            // Detener el escáner
            html5QrcodeScanner.clear();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('btn-scan').style.display = 'block';
            document.getElementById('btn-scan').innerText = "📷 Escanear Otro QR";

            // Obtener fecha y hora actual
            const fechaActual = new Date().toLocaleString('es-ES');

            // Guardar el registro
            const nuevoRegistro = {
                datos: decodedText,
                fecha: fechaActual
            };

            registros.push(nuevoRegistro);
            localStorage.setItem('qr_records', JSON.stringify(registros));

            // Actualizar la vista
            renderizarHistorial();
        }

        // Función en caso de que un frame no detecte QR (se ignora para que siga buscando)
        function onScanFailure(error) {
            // console.warn(`Error al escanear: ${error}`);
        }

        // Inicializar la vista cargando el historial
        renderizarHistorial();
    </script>

</body>
</html>
